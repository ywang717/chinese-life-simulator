name: Balance Failure Diagnostic

on:
  push:
    branches:
      - feature/life-continuity-optimizations
    paths:
      - '.github/workflows/balance-diagnostic.yml'
      - 'scripts/diagnose-balance-choice.mjs'
      - 'dist/engine/event.js'

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Reproduce 6000 checkpoint failure range
        env:
          OFFSET: '6200'
          SHARD: '0'
          COUNT: '50'
        run: node scripts/diagnose-balance-choice.mjs
