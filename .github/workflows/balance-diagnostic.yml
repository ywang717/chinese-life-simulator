name: Balance Failure Diagnostic

on:
  push:
    branches:
      - feature/life-continuity-optimizations
    paths:
      - '.github/workflows/balance-diagnostic.yml'
      - 'scripts/diagnose-balance-choice.mjs'

jobs:
  diagnose:
    strategy:
      fail-fast: false
      matrix:
        offset: [2700,2710,2720,2730,2740,2750,2760,2770,2780,2790]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Reproduce ten-seed slice
        env:
          OFFSET: ${{ matrix.offset }}
          SHARD: '0'
          COUNT: '10'
        run: node scripts/diagnose-balance-choice.mjs
