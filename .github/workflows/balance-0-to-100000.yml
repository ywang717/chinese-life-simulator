name: Balance 0 to 100000

on:
  push:
    branches:
      - feature/balance-dashboard
      - feature/balance-100k
    paths:
      - '.github/workflows/balance-0-to-100000.yml'
      - 'scripts/balance-segment.mjs'
      - 'scripts/balance-progress*.mjs'
      - 'scripts/publish-balance-progress.sh'
      - 'scripts/balance-shard.mjs'
      - 'scripts/diagnose-balance-choice.mjs'
      - 'scripts/balance-lib.mjs'
      - 'dist/engine/**'
      - 'dist/data/**'
      - 'dist/state/player.js'

permissions:
  contents: write

concurrency:
  group: balance-100k-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  segment_0:
    name: Seeds 0-9999
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm test
      - run: npm run build
      - name: Scan 0-9999 with live checkpoints
        run: node scripts/balance-segment.mjs
        env:
          START: '0'
          COUNT: '10000'

  segment_10000:
    name: Seeds 10000-19999
    needs: segment_0
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4
        with: {ref: '${{ github.ref_name }}', fetch-depth: 0}
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - run: node scripts/balance-segment.mjs
        env: {START: '10000', COUNT: '10000'}

  segment_20000:
    name: Seeds 20000-29999
    needs: segment_10000
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4
        with: {ref: '${{ github.ref_name }}', fetch-depth: 0}
      - uses: actions/setup-node@v4
