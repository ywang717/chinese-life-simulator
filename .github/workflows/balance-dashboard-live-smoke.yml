name: Balance Dashboard Live Smoke

on:
  push:
    branches:
      - balance-dashboard-live
    paths:
      - '.github/workflows/balance-dashboard-live-smoke.yml'
      - 'dist/balance.html'
      - 'dist/balance-dashboard.js'
      - 'dist/balance.css'
  workflow_dispatch:

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - name: Diagnose public dashboard response
        shell: bash
        run: |
          set -u
          PAGE='https://raw.githack.com/ywang717/chinese-life-simulator/balance-dashboard-live/dist/balance.html'
          echo '=== HEADERS ==='
          curl -sSIL "$PAGE" || true
          echo '=== BODY ==='
          curl -sSL "$PAGE" | head -n 40 || true
          echo '=== LIVE DATA ==='
          curl -sSIL 'https://raw.githubusercontent.com/ywang717/chinese-life-simulator/refs/heads/feature/balance-speed/dist/balance-progress.json' || true
