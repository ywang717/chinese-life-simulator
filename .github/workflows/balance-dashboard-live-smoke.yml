name: Balance Dashboard Live Smoke

on:
  push:
    branches:
      - balance-dashboard-live
    paths:
      - '.github/workflows/balance-dashboard-live-smoke.yml'
      - 'dist/balance.html'
      - 'dist/balance-dashboard.js'
      - 'dist/balance.css'
  workflow_dispatch:

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - name: Verify public dashboard and live progress source
        shell: bash
        run: |
          set -euo pipefail
          PAGE='https://raw.githack.com/ywang717/chinese-life-simulator/balance-dashboard-live/dist/balance.html'
          JS='https://raw.githack.com/ywang717/chinese-life-simulator/balance-dashboard-live/dist/balance-dashboard.js'
          CSS='https://raw.githack.com/ywang717/chinese-life-simulator/balance-dashboard-live/dist/balance.css'
          DATA='https://raw.githubusercontent.com/ywang717/chinese-life-simulator/refs/heads/feature/balance-speed/dist/balance-progress.json'

          curl -fsSL -D /tmp/page.headers "$PAGE" -o /tmp/page.html
          grep -q '种子生成进度' /tmp/page.html
          grep -qi 'content-type: text/html' /tmp/page.headers
          curl -fsSL "$JS" | grep -q 'raw.githubusercontent.com/ywang717/chinese-life-simulator/refs/heads/feature/balance-speed/dist/balance-progress.json'
          curl -fsSL "$CSS" >/dev/null
          curl -fsSL "$DATA" | grep -q '"targetSeeds": 10000'
