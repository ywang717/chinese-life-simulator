name: Balance 5000 to 10000

on:
  push:
    branches:
      - feature/life-continuity-optimizations
      - feature/balance-speed
    paths:
      - '.github/workflows/balance-5000-to-10000.yml'
      - 'dist/engine/event.js'
      - 'dist/engine/year.js'
      - 'dist/data/events.js'
      - 'dist/data/careers.js'
      - 'dist/data/continuity.js'
      - 'dist/state/player.js'
      - 'scripts/balance-lib.mjs'
      - 'scripts/balance-shard.mjs'
      - 'scripts/balance-aggregate.mjs'
      - 'scripts/diagnose-balance-choice.mjs'
      - 'tests/balance-speed.test.js'

jobs:
  gate:
    name: Balance gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - run: npm test
      - run: npm run build

  batch_5000:
    name: 5000-5999 shard ${{ matrix.shard }}
    needs: gate
    strategy:
      fail-fast: false
      matrix: {shard: [0,1,2,3,4,5,6,7]}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - name: Fast scan 125 lifetimes
        run: node scripts/balance-shard.mjs
        env: {OFFSET: '5000', SHARD: '${{ matrix.shard }}', COUNT: '125', OUT: 'balance-${{ matrix.shard }}.json'}
      - name: Diagnose failed seeds
        run: node scripts/diagnose-balance-choice.mjs
        env: {INPUT: 'balance-${{ matrix.shard }}.json'}
      - uses: actions/upload-artifact@v4
        if: always()
        with: {name: 'balance-5000-${{ matrix.shard }}', path: 'balance-${{ matrix.shard }}.json', retention-days: 14}

  checkpoint_6000:
    name: Checkpoint 6000
    needs: batch_5000
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - uses: actions/download-artifact@v4
        with: {pattern: 'balance-5000-*', path: balance-results}
      - run: node scripts/balance-aggregate.mjs
        env: {OUT: balance-summary-6000.json}
      - uses: actions/upload-artifact@v4
        with: {name: balance-checkpoint-6000, path: balance-summary-6000.json, retention-days: 30}

  batch_6000:
    name: 6000-6999 shard ${{ matrix.shard }}
    needs: checkpoint_6000
    strategy:
      fail-fast: false
      matrix: {shard: [0,1,2,3,4,5,6,7]}
