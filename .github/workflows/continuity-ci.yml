name: Continuity CI

on:
  push:
    branches:
      - feature/life-continuity
      - feature/life-continuity-optimizations

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --test tests/continuity.test.js
