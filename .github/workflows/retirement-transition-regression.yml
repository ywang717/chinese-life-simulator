name: Retirement Transition Regression

on:
  push:
    branches:
      - feature/life-continuity-optimizations
    paths:
      - '.github/workflows/retirement-transition-regression.yml'
      - 'tests/retirement-transition.test.js'
      - 'dist/engine/event.js'

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --test tests/retirement-transition.test.js
